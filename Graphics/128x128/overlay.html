<!DOCTYPE html>
<html>
<head>
    <style>
        :root { --main-scale-intensity: 1.15; }
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; display: flex; align-items: center; justify-content: flex-start; }
        #image-container { position: relative; transition: width 0.3s, height 0.3s, margin 0.3s; flex-shrink: 0; }
        .heart-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.4s ease-in-out; }
        .heart-img.active { opacity: 1; }
        .pulse-container { transform-origin: center center; }

        @keyframes anim-pulse { 0% { transform: scale(1); } 50% { transform: scale(var(--main-scale-intensity)); } 100% { transform: scale(1); } }
        @keyframes anim-heartbeat { 0% { transform: scale(1); } 15% { transform: scale(var(--main-scale-intensity)); } 30% { transform: scale(1); } 45% { transform: scale(var(--main-scale-intensity)); } 70% { transform: scale(1); } 100% { transform: scale(1); } }
        @keyframes anim-bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0) scale(1);} 40% {transform: translateY(-10px) scale(var(--main-scale-intensity));} 60% {transform: translateY(-5px) scale(var(--main-scale-intensity));} }
        @keyframes anim-jiggle { 0% { transform: translate(1px, 1px) scale(1); } 10% { transform: translate(-1px, -2px) scale(var(--main-scale-intensity)); } 20% { transform: translate(-3px, 0px) scale(var(--main-scale-intensity)); } 30% { transform: translate(3px, 2px) scale(var(--main-scale-intensity)); } 40% { transform: translate(1px, -1px) scale(1); } 50% { transform: translate(-1px, 2px) scale(var(--main-scale-intensity)); } 60% { transform: translate(-3px, 1px) scale(var(--main-scale-intensity)); } 100% { transform: translate(1px, 1px) scale(1); } }
        
        #bpm-text { color: white; font-weight: bold; transition: font-size 0.3s, margin 0.3s; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 3px 3px 5px rgba(0,0,0,0.8); z-index: 10; }
    </style>
</head>
<body>

    <div id="image-container">
        <div id="physical-anim-container" class="pulse-container">
            <img id="img-afk" class="heart-img active">
            <img id="img-1" class="heart-img">
            <img id="img-2" class="heart-img">
            <img id="img-3" class="heart-img">
            <img id="img-4" class="heart-img">
            <img id="img-5" class="heart-img">
        </div>
    </div>
    
    <div id="bpm-text">AFK</div>

    <script>
        const bpmText = document.getElementById("bpm-text");
        const imgFrame = document.getElementById("image-container");
        const physicalContainer = document.getElementById("physical-anim-container");
        let currentImageId = "img-afk";
        let config = {};

        function connect() {
            const ws = new WebSocket("ws://localhost:8765");

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === "config_update") {
                    config = data.config;
                    
                    // Update Image Sources from Expert Mode Config
                    document.getElementById("img-afk").src = config.imgAfk;
                    document.getElementById("img-1").src = config.img1;
                    document.getElementById("img-2").src = config.img2;
                    document.getElementById("img-3").src = config.img3;
                    document.getElementById("img-4").src = config.img4;
                    document.getElementById("img-5").src = config.img5;

                    document.documentElement.style.setProperty('--main-scale-intensity', config.animScaleIntensity);

                    if (config.overlayLayout === "center") {
                        document.body.style.flexDirection = "row";
                        document.body.style.justifyContent = "center";
                        document.body.style.position = "relative";
                        imgFrame.style.position = "absolute";
                        bpmText.style.position = "absolute";
                        bpmText.style.margin = "0"; 
                    } else {
                        document.body.style.flexDirection = config.overlayLayout;
                        document.body.style.justifyContent = "flex-start";
                        document.body.style.position = "static";
                        imgFrame.style.position = "relative";
                        bpmText.style.position = "static";
                        
                        if (config.overlayLayout === "row") bpmText.style.margin = `0 0 0 ${config.elementSpacing}px`;
                        else if (config.overlayLayout === "row-reverse") bpmText.style.margin = `0 ${config.elementSpacing}px 0 0`;
                        else if (config.overlayLayout === "column") bpmText.style.margin = `${config.elementSpacing}px 0 0 0`;
                        else if (config.overlayLayout === "column-reverse") bpmText.style.margin = `0 0 ${config.elementSpacing}px 0`;
                    }

                    imgFrame.style.display = config.showImage ? "block" : "none";
                    bpmText.style.display = config.showText ? "block" : "none";
                    imgFrame.style.width = config.size + "px";
                    imgFrame.style.height = config.size + "px";
                    bpmText.style.fontSize = config.fontSize + "px";
                    
                    if (config.animationType === "none") {
                        physicalContainer.style.animation = "none";
                    }
                }
                
                if (data.type === "bpm_update") {
                    bpmText.innerText = data.bpm === "AFK" ? "AFK" : data.bpm + " BPM";

                    const targetId = "img-" + data.state;
                    if (targetId !== currentImageId) {
                        document.getElementById(currentImageId).classList.remove("active");
                        document.getElementById(targetId).classList.add("active");
                        currentImageId = targetId;
                    }

                    if (config.animationType !== "none" && data.bpm !== "AFK" && typeof data.bpm === 'number') {
                        const secondsPerBeat = 60 / data.bpm;
                        physicalContainer.style.animation = `anim-${config.animationType} ${secondsPerBeat}s infinite`;
                    } else if (data.bpm === "AFK" || config.animationType === "none") {
                        physicalContainer.style.animation = "none";
                    }
                }
            };

            ws.onclose = () => setTimeout(connect, 2000);
        }

        connect();
    </script>
</body>
</html>
